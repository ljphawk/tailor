apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

def tailorGroupId = 'com.github.ljphawk'
def tailorArtifactId = 'tailor'
def tailorVersion = '1.1.7'

android {
    compileSdkVersion 28

    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 28

        externalNativeBuild {
            cmake {
                cppFlags "-fvisibility=hidden"
                abiFilters 'armeabi-v7a', 'arm64-v8a'
                arguments "-DANDROID_ARM_MODE=arm", "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    ndkVersion "23.1.7779620"
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:support-annotations:28.0.0'
}

task androidSourcesJar(type: Jar) {
    classifier = 'sources'
    from android.sourceSets.main.java.srcDirs
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = tailorGroupId
                artifactId = tailorArtifactId
                version = tailorVersion

                artifact("$buildDir/outputs/aar/library-release.aar") {
                    builtBy tasks.getByName("bundleReleaseAar")
                }
                artifact androidSourcesJar

                pom.withXml {
                    def root = asNode()
                    root.appendNode('name', tailorArtifactId)
                    root.appendNode('description', 'Tailor Android library with 16 KB page-size compatible native binaries')
                }
            }
        }
    }
}
